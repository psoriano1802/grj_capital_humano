version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ${CLIENT}_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_123}
      POSTGRES_DB: rh_management
    volumes:
      - rh_db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CLIENT}_app
    restart: always
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=rh_management
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres_password_123}
      - JWT_SECRET=${JWT_SECRET:-cambia_este_secreto}
      - FACE_RECOGNITION_ENGINE=descriptor
      - FACE_DISTANCE_THRESHOLD=0.5
    volumes:
      - rh_uploads:/app/uploads
    networks:
      - internal
      - ch_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CLIENT}.rule=Host(`${CLIENT}.${DOMAIN}`)"
      - "traefik.http.routers.${CLIENT}.entrypoints=web"
      - "traefik.http.services.${CLIENT}.loadbalancer.server.port=3000"
      - "traefik.http.routers.${CLIENT}_any.rule=PathPrefix(`/`)"
      - "traefik.http.routers.${CLIENT}_any.priority=1"
      - "traefik.http.routers.${CLIENT}_any.entrypoints=web"
      - "traefik.http.routers.${CLIENT}_any.service=${CLIENT}"

networks:
  internal:
    internal: true
  ch_proxy:
    external: true

volumes:
  rh_db_data:
  rh_uploads: